name: Build ARM64 CI image

on:
  push:
    paths:
      - '.github/docker/arm64/Dockerfile'

jobs:
  docker:
    runs-on: ubuntu-24.04-arm

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v6

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .github/docker/arm64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/elash-ci-arm64:latest

