name: CI on Linux X86-64

permissions:
  contents: read

on:
  push:
    branches:
      - '**'
    tags:
      - '**'
  pull_request:
    branches:
      - '**'
  workflow_dispatch:

jobs:
  run-ci:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/${{ github.repository_owner }}/elash-ci-x64:latest
    env:
      CC: ccache cc

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Cache ccache
        uses: actions/cache@v6
        with:
          path: /ccache
          key: ${{ runner.os }}-${{ runner.arch }}-ccache-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-ccache-${{ github.ref_name }}-
            ${{ runner.os }}-${{ runner.arch }}-ccache-

      - name: Zero ccache stats
        run: ccache -z

      - name: Build
        run: make libelash-static elc -j$(nproc)

      - name: Show ccache stats
        run: ccache -s

      - name: Unit tests
        run: make unit-test

      - name: End-to-End tests
        run: make test-e2e

      - name: Archive
        if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
        run: make archive

      - name: Upload Artifact
        if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v7
        with:
          archive: false
          path: out/*-release.tar.gz
